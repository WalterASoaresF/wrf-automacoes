# Prévia do site no GitHub Pages (https://walterasoaresf.github.io/wrf-automacoes/).
# Roda a cada push na main. A hospedagem oficial continua sendo o Cloudflare Pages
# (CLAUDE.md, seção 2); esta prévia sai com "noindex" para não concorrer com ela nos buscadores.
#
# Antes do primeiro deploy: no GitHub, Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Prévia no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://walterasoaresf.github.io
          BASE_PATH: /wrf-automacoes
          PUBLIC_PREVIA: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
